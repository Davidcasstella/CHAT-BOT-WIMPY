version: '3.8'

services:
  whatsapp-bot:
    build: .
    container_name: wimpy-chatbot
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persistir datos de autenticación de WhatsApp
      - ./auth_info:/app/auth_info
      # Persistir configuración del bot
      - ./bot-config.json:/app/bot-config.json
      # Persistir archivos de audio
      - ./audio:/app/audio
      # Persistir imágenes del catálogo
      - ./imagenes:/app/imagenes
      # Persistir menús
      - ./menus:/app/menus
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
